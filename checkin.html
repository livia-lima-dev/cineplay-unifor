<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineplay Unifor - Check-in de Sala</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="layout-container">
            <div class="content-wrapper">
                <div class="layout-content-container">
                    <header class="header">
                        <div class="header-content">
                            <p class="logo">Cineplay Unifor</p>
                            <button class="checkout-nav-button" onclick="window.location.href='checkout.html'">
                                <span class="material-symbols-outlined">logout</span>
                                <span>Check-out</span>
                            </button>
                        </div>
                    </header>
                    
                    <main class="main-content">
                        <div class="checkin-section">
                            <div class="checkin-container">
                                <div class="checkin-content">
                                    <h1 class="checkin-title">Check-in da Sala</h1>
                                    <p class="checkin-subtitle">Para registrar sua entrada na sala, aponte a câmera do seu celular para o QR Code abaixo.</p>
                                    
                                    <div class="qr-code-container">
                                        <svg class="qr-code" height="256" viewBox="0 0 256 256" width="256" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M48 48h64v64H48zM56 56v48h48V56zm104-8h48v48h-48zm8 8v32h32V56zM48 144h64v64H48zm8 8v48h48v-48zM152 144h8v8h-8zm8 8h8v8h-8zm8 8h8v8h-8zm-8 8h8v8h-8zm8-16h8v8h-8zm-16 16h8v8h-8zm8 8h8v8h-8zm8 8h8v8h-8zm8 8h8v8h-8zm-8 8h8v8h-8zm8 8h8v8h-8zm-16 8h8v8h-8zm-8-8h8v8h-8zm8 8h8v8h-8zm8 8h8v8h-8zm-8-24h8v8h-8zm8 8h8v8h-8zm-24 16h8v8h-8zm8 8h8v8h-8zm-8 8h8v8h-8zm-8 8h8v8h-8zm8 8h8v8h-8zm8-8h8v8h-8zm8 8h8v8h-8zm-8 8h8v8h-8zm8 8h8v8h-8zm-40-104h8v8h-8zm8 8h8v8h-8zm-8 8h8v8h-8zm-8 8h8v8h-8zm24 8h8v8h-8zm8-8h8v8h-8zm-8-8h8v8h-8zm-8 8h8v8h-8zm8 8h8v8h-8zm-8 8h8v8h-8zm-8 8h8v8h-8zm8 8h8v8h-8zm8 8h8v8h-8zm-8-24h8v8h-8zm8-8h8v8h-8zm-8 8h8v8h-8zm-8 8h8v8h-8zm24-8h8v8h-8zm8 8h8v8h-8zm8 16h8v8h-8zm-16-8h8v8h-8zm-8-8h8v8h-8zm0 8h8v8h-8zm-8 8h8v8h-8zm-8 8h8v8h-8zm8-8h8v8h-8zm-8 8h8v8h-8zm8 8h8v8h-8zm8 8h8v8h-8zm-24 0h8v8h-8zm-8-8h8v8h-8zm8-8h8v8h-8zm-8-8h8v8h-8zm8-8h8v8h-8z"></path>
                                        </svg>
                                    </div>
                                    
                                    <p class="checkin-instruction">Este QR Code é exclusivo para o check-in na sala.</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/checkin.js"></script>
</body>
</html>
