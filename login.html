<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cineplay Unifor - Acesso à Conta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#064EBA",
            "background-light": "#f5f7f8",
            "background-dark": "#0f1723",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
</head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light p-4 dark:bg-background-dark group/design-root" style='font-family: Inter, "Noto Sans", sans-serif;'>
<div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-8">
<div class="flex flex-col items-center gap-6">
<!-- Logo -->
<div class="w-full max-w-[200px]">
<div class="w-full gap-1 overflow-hidden bg-slate-50 @[480px]:gap-2 aspect-[16/9] rounded-lg flex dark:bg-slate-900">
<div class="w-full bg-center bg-no-repeat bg-contain aspect-auto rounded-none flex-1" data-alt="Logotipo Cineplay Unifor" style='background-image: url("cineplay.jpeg");'></div>
</div>
</div>
<!-- Page Heading -->
<div class="flex w-full flex-wrap justify-center gap-3 text-center">
<div class="flex w-full flex-col gap-2">
<p class="text-slate-900 tracking-tight text-[32px] font-bold leading-tight dark:text-slate-50">Acesse sua conta</p>
<p class="text-slate-500 text-sm font-normal leading-normal dark:text-slate-400">Autenticação segura via Sistema de Login Unificado da Unifor (SSO).</p>
</div>
</div>
<!-- Erro de Autenticação -->
<div class="flex w-full flex-col gap-2">
<div class="flex items-center gap-3 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-900/50 dark:bg-red-900/20 dark:text-red-300">
<span class="material-symbols-outlined !text-xl text-red-600 dark:text-red-400">error</span>
<p>Falha na autenticação institucional.</p>
</div>
</div>
<!-- Single Button -->
<div class="flex w-full justify-center">
<button onclick="entrarComSSO()" class="flex min-w-[84px] w-full max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-slate-50 gap-2 text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900 disabled:cursor-not-allowed disabled:bg-slate-300 dark:disabled:bg-slate-600">
<span class="material-symbols-outlined text-slate-50">lock</span>
<span class="truncate">Entrar com SSO Unifor</span>
</button>
</div>
<!-- Checklist -->
<div class="flex w-full flex-col gap-2 border-t border-slate-200 pt-4 dark:border-slate-800">
<div class="px-0">
<label class="flex cursor-pointer items-start gap-x-3 py-3">
<input id="termosCheckbox" class="mt-0.5 h-5 w-5 flex-shrink-0 rounded border-slate-300 border-2 bg-transparent text-primary checked:border-primary checked:bg-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-white dark:border-slate-600 dark:checked:border-primary dark:focus:ring-offset-slate-900" type="checkbox"/>
<p class="text-slate-700 text-sm font-normal leading-normal dark:text-slate-300">Li e concordo com os <a class="font-medium text-primary underline hover:text-primary/80" href="termosdeuso.html">Termos de Uso</a>.</p>
</label>
</div>
</div>
<!-- Meta Text -->
<p class="text-slate-500 text-sm font-normal leading-normal text-center underline hover:text-primary dark:text-slate-400"><a href="suporte.html">Precisa de ajuda?</a></p>
</div>
</div>
</div>

<script>
function entrarComSSO() {
    const checkbox = document.getElementById('termosCheckbox');
    
    if (!checkbox.checked) {
        alert('Por favor, aceite os Termos de Uso antes de continuar.');
        return;
    }
    
    // Redireciona para a tela de confirmação de dados
    window.location.href = 'confirmardados.html';
}
</script>
</body></html>
